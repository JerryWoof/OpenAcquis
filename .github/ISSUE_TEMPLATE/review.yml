name: Review a machine suggestion
description: Confirm, reject or correct one OpenAcquis suggestion (the website's review page fills this in for you).
title: "Review: "
labels: ["review"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reviewing! This form is normally filled in by the
        [review page](https://jerrywoof.github.io/OpenAcquis/review.html). A bot checks the record and
        comments within a minute or two; a maintainer then adds it to `data/reviews/`.
        Format and rules: [docs/review.md](https://github.com/JerryWoof/OpenAcquis/blob/main/docs/review.md).

        A review is your reading of two texts. It is published with your GitHub user name and is not legal advice.
  - type: textarea
    id: record
    attributes:
      label: Review record
      description: The JSON record from the review page. Edit only the `note` (or the verdict) unless you know the format.
      render: json
    validations:
      required: true
  - type: textarea
    id: comment
    attributes:
      label: Anything else? (optional)
      description: Context for the maintainers, e.g. a source you used. Not part of the dataset.
  - type: checkboxes
    id: licence
    attributes:
      label: Licence
      options:
        - label: I agree that this review is published under CC-BY-4.0 as part of the OpenAcquis dataset, credited to my GitHub user name.
          required: true
